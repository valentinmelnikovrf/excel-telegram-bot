services:
  - type: web
    name: excel-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PRICE_STARS
        value: 10
      - key: RENDER
        value: true